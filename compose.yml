version: "3.8"

services:

  # 🤖 1. THE SOVEREIGN AGENT (Backend)
  backend:
    build: ./backend
    container_name: sovereign-agent
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./.env:/app/.env
      - ./data/sovereign_db.sqlite:/app/sovereign_db.sqlite
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sovereign-net

  # 💻 2. THE DASHBOARD (Frontend)
  frontend:
    build: ./frontend
    container_name: sovereign-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./.env:/app/.env
    environment:
      - VITE_API_URL=http://localhost:3001
    networks:
      - sovereign-net

networks:
  sovereign-net:
    driver: bridge
